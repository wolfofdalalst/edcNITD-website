server {
    listen 443 ssl http2;
    server_name edcnitd.co.in www.edcnitd.co.in;

    ssl_certificate /etc/letsencrypt/live/edcnitd.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edcnitd.co.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/edcnitd.co.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    location /static/ {
        alias /app/website/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    location /media/ {
        alias /app/website/media/;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


