version: "3.9"

services:
  web:
    build: .
    container_name: edc_web
    command: gunicorn website.wsgi:application --chdir /app/website --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./website:/app/website:ro
      - ./website/staticfiles:/app/website/staticfiles
      - ./website/media:/app/website/media
      - ./website/db.sqlite3:/app/website/db.sqlite3
    environment:
      - DJANGO_SETTINGS_MODULE=website.settings
      - PYTHONUNBUFFERED=1
      - EMAIL=changeme@example.com
      - EMAIL_PASSWORD=changeme
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: edc_nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/ssl-dhparams.pem:/etc/ssl/certs/dhparam.pem
      - ./website/staticfiles:/static:ro
      - ./website/media:/media:ro
    restart: unless-stopped

# Optional one-shot service to collectstatic
# docker compose run --rm web python website/manage.py collectstatic --noinput
